name: CI Tests

on: 
  pull_request:
    branches: [ main, develop ]
jobs:
  backend-lint-test:
    name: Backend Lint and Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio black flake8 mypy

      - name: Run Black (formatter check)
        run: black --check .

      - name: Run Flake8 (linter)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Run MyPy (type checker)
        run: mypy . --ignore-missing-imports || true
      - name: Run Pytest (unit tests)
        run: pytest --cov=. --cov-report=xml --cov-report=term

  frontend-lint-test:
    name: Frontend List and Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint
      - name: Run Prettier check
        run: npm run format:check || npx prettier --check
      - name: Type check
        run: npm run type-check || npx tsc --noEmit
      - name: Run tests
        run: npm test --coverage --watchAll=false
      - name: Build application
        run: npm run build
  integration-check:
    name: Integration Check
    runs-on: ubuntu-latest
    needs: [backend-lint-test, frontend-lint-test]

    steps: 
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with: 
          node-version: '20'
      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Start backend server
        working-directory: ./backend
        run: |
          uviron main:app --host 0.0.0.0 --port 8000 &
          echo $! > backend.pid
          sleep 5
      - name: Health check backend
        run: curl -f http://localhost:8000/health || curl -f http://localhost:8000/docs
      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
      
      - name: Cleanup
        if: always()
        run: |
          if [ -f backend/backend.pid ]; then
            kill $(cat backend/backend.pid) || true
          fi


